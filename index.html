<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Generator</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8f9fa;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1c1e21;
      padding: 15px;
    }

    .tool-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      width: 100%;
      max-width: 450px;
    }

    .section-title {
      font-weight: 700;
      color: #003087;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-label {
      font-weight: 600;
      color: #6c757d;
      font-size: 0.75rem;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .form-control {
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #ced4da;
      font-size: 0.95rem;
    }

    .peso-display {
      background-color: #f0f7ff;
      border: 1px solid #cfe2ff;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      border-style: dashed;
      transition: all 0.2s ease;
    }

    .peso-display:hover {
      background-color: #e6f2ff;
      border-color: #0070ba;
    }

    .peso-total { 
      font-size: 2.2rem; 
      font-weight: 800; 
      color: #0070ba; 
      letter-spacing: 1px;
    }

    .hidden { display: none; }
    
    .fade-out { 
      opacity: 1; 
      transition: opacity 0.5s ease; 
      text-align: center;
      display: block;
      height: 20px;
    }
    
    .fade-out.hidden { opacity: 0; }

    .input-group-text {
      background-color: #f8f9fa;
      border-color: #ced4da;
      color: #6c757d;
    }
  </style>
</head>
<body>

  <div class="tool-card">
    <h4 class="section-title"><i class="fa-solid fa-fingerprint me-2"></i> Name Generator</h4>
    
    <div class="mb-4">
      <label class="form-label">Configuration Key</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
        <input type="text" id="gen_salt" class="form-control" placeholder="••••••" onchange="saveGenSalt()">
      </div>
    </div>
    
    <div class="mb-4">
      <label class="form-label">Reference Name</label>
      <input type="text" id="gen_input" class="form-control" placeholder="••••••" oninput="runGenerator()">
    </div>
    
    <div class="position-relative">
      <label class="form-label">Generated Identifier</label>
      <div id="genResultBox" class="peso-display" onclick="copyGenResult()">
        <div class="peso-total" id="gen_output">••••••</div>
        <div class="text-muted small mt-1">Click box to copy</div>
      </div>
      <div id="genCopyAlert" class="text-success mt-2 fade-out hidden" style="font-size: 0.8rem; font-weight: bold;">
        <i class="fa-solid fa-check me-1"></i> Copied to clipboard
      </div>
    </div>
  </div>

  <script>
    // Load saved key on startup
    window.onload = () => {
      const savedSalt = localStorage.getItem('gen_salt');
      if (savedSalt) {
        document.getElementById('gen_salt').value = savedSalt;
      }
    };

    function saveGenSalt() {
      localStorage.setItem('gen_salt', document.getElementById('gen_salt').value);
      runGenerator();
    }

    async function runGenerator() {
      // Normalization: Lowercase and strip ALL whitespace (including middle spaces)
      const rawInput = document.getElementById('gen_input').value;
      const input = rawInput.toLowerCase().replace(/\s+/g, '');
      const salt = document.getElementById('gen_salt').value;
      const outputEl = document.getElementById('gen_output');

      if (!input || !salt) {
        outputEl.innerText = "------";
        return;
      }

      // Cryptographic Logic (Deterministic SHA-256 to Base36)
      const encoder = new TextEncoder();
      const data = encoder.encode(input + salt);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hexString = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      const bigIntHash = BigInt("0x" + hexString);
      const base36 = bigIntHash.toString(36);

      // Slice 6 characters (starting at index 7 for entropy)
      const result = base36.substring(7, 13);
      outputEl.innerText = result;
    }

    function copyGenResult() {
      const text = document.getElementById('gen_output').innerText;
      if (text === "------") return;
      
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);

      const alert = document.getElementById('genCopyAlert');
      alert.classList.remove('hidden');
      setTimeout(() => alert.classList.add('hidden'), 2000);
    }
  </script>

</body>
</html>
