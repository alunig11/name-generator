<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center font-sans px-6">

  <!-- Header -->
  <h1 class="text-4xl font-bold text-gray-900 mb-10 tracking-tight text-center">
    Name Generator
  </h1>

  <!-- Input -->
  <input 
    id="appName" 
    type="text" 
    placeholder="Enter text here"
    class="w-full max-w-md px-6 py-4 mb-6 rounded-full border border-gray-300 text-gray-800 
           focus:ring-4 focus:ring-indigo-400 focus:border-indigo-500 outline-none
           text-xl shadow-sm bg-white"
  >

  <!-- Results -->
  <div id="resultContainer" class="mt-10 space-y-4 w-full max-w-md"></div>

  <script>
    const VOWELS = ["a","e","i","o","u"];

    // Families
    const VCV_SUFFIXES = ["aru", "ume", "ino", "osu", "eli"]; // base ends with consonant
    const CVC_SUFFIXES = ["rem", "lin", "tal", "por", "sud"]; // base ends with vowel

    // Helpers
    function lastVowelOfBase(base) {
      for (let i = base.length - 1; i >= 0; i--) {
        const ch = base[i];
        if (VOWELS.includes(ch)) return ch;
      }
      return null;
    }

    function coreVowelOfSuffix(suf, isVCV) {
      return isVCV ? suf[0] : suf[1]; // VCV: first char; CVC: middle char
    }

    function areAdjacentVowels(a, b) {
      if (!a || !b) return false;
      const ring = ["a","e","i","o","u"];
      const ia = ring.indexOf(a), ib = ring.indexOf(b);
      if (ia === -1 || ib === -1) return false;
      const left = (ia - 1 + ring.length) % ring.length;
      const right = (ia + 1) % ring.length;
      return ib === left || ib === right;
    }

    function scoreAlias(base, suf, isVCV) {
      const alias = base + suf;
      let score = 0;

      // Boundary transition (always +2 in your rule sets)
      score += 2;

      // Vowel harmony
      const lv = lastVowelOfBase(base);
      const sv = coreVowelOfSuffix(suf, isVCV);
      if (lv && sv) {
        if (lv === sv) score -= 2;
        else if (areAdjacentVowels(lv, sv)) score += 1;
      }

      // Ending softness
      const end = alias.slice(-1);
      if (["n","l","m"].includes(end)) score += 1;
      if (["u","i"].includes(end)) score += 1;
      if (["r","d","t"].includes(end)) score -= 1;

      // Length sanity
      if (alias.length > 10) score -= 1;

      return { alias, score };
    }

    function generate() {
      const raw = document.getElementById("appName").value.trim().toLowerCase();
      const container = document.getElementById("resultContainer");
      container.innerHTML = "";
      if (!raw) return;

      const base = raw;
      const endsWithVowel = VOWELS.includes(base.slice(-1));
      const isVCV = !endsWithVowel;
      const suffixes = isVCV ? VCV_SUFFIXES : CVC_SUFFIXES;

      const ranked = suffixes
        .map(suf => scoreAlias(base, suf, isVCV))
        .sort((a, b) => b.score - a.score || a.alias.localeCompare(b.alias));

      const maxScore = ranked[0].score;
      const minScore = ranked[ranked.length - 1].score;

      ranked.forEach(({ alias, score }) => {
        const row = document.createElement("div");
        row.className = "flex items-center justify-between bg-white px-4 py-3 rounded-lg shadow";

        const text = document.createElement("span");
        text.className = "text-xl font-bold";

        if (score === maxScore) {
          text.classList.add("text-green-600");
        } else if (score === minScore) {
          text.classList.add("text-red-600");
        } else {
          text.classList.add("text-indigo-700");
        }

        text.innerText = alias;

        const copyBtn = document.createElement("button");
        copyBtn.innerText = "Copy";
        copyBtn.className = "px-4 py-2 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium";
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(alias).then(() => {
            copyBtn.innerText = "Copied!";
            copyBtn.classList.add("bg-green-500","text-white");
            setTimeout(() => {
              copyBtn.innerText = "Copy";
              copyBtn.classList.remove("bg-green-500","text-white");
            }, 1200);
          });
        };

        row.appendChild(text);
        row.appendChild(copyBtn);
        container.appendChild(row);
      });
    }

    document.getElementById("appName").addEventListener("input", generate);
  </script>
</body>
</html>
